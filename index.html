<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#FF6B9D"><title>宝宝学英语 🌈</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="favicon.png"><style>/* ========== 全局重置 ========== */* {  margin: 0;  padding: 0;  box-sizing: border-box;  -webkit-tap-highlight-color: transparent;  -webkit-touch-callout: none;  user-select: none;}​:root {  --pink: #FF6B9D;  --orange: #FFA84A;  --yellow: #FFD93D;  --green: #6BCB77;  --blue: #4D96FF;  --purple: #B084CC;  --bg: #FFF5F7;  --card-bg: #FFFFFF;  --text: #4A4A4A;  --shadow: 0 4px 16px rgba(0,0,0,0.08);  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);}​html, body {  height: 100%;  font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;  background: var(--bg);  color: var(--text);  overflow: hidden;  touch-action: manipulation;}​/* ========== App容器 ========== */#app {  width: 100%;  height: 100vh;  height: 100dvh;  max-width: 480px;  margin: 0 auto;  position: relative;  display: flex;  flex-direction: column;  background: var(--bg);}​/* ========== 页面通用 ========== */.page {  display: none;  flex: 1;  flex-direction: column;  overflow-y: auto;  -webkit-overflow-scrolling: touch;  padding-bottom: 90px;  animation: fadeIn 0.3s ease;}.page.active { display: flex; }​@keyframes fadeIn {  from { opacity: 0; transform: translateY(10px); }  to { opacity: 1; transform: translateY(0); }}​/* ========== 顶部栏 ========== */.topbar {  padding: 16px 20px 10px;  display: flex;  align-items: center;  justify-content: space-between;  flex-shrink: 0;}.topbar h1 {  font-size: 24px;  color: var(--pink);  display: flex;  align-items: center;  gap: 8px;}.topbar .streak-badge {  background: linear-gradient(135deg, var(--orange), var(--yellow));  color: white;  padding: 6px 14px;  border-radius: 20px;  font-size: 14px;  font-weight: 700;  box-shadow: var(--shadow);  display: flex;  align-items: center;  gap: 4px;}​/* ========== 首页 ========== */.welcome-card {  margin: 8px 16px 16px;  background: linear-gradient(135deg, var(--pink), var(--purple));  border-radius: 24px;  padding: 24px;  color: white;  box-shadow: var(--shadow-lg);  position: relative;  overflow: hidden;}.welcome-card::after {  content: '';  position: absolute;  top: -20px;  right: -20px;  font-size: 100px;  opacity: 0.15;}.welcome-card h2 {  font-size: 20px;  margin-bottom: 6px;}.welcome-card p {  font-size: 14px;  opacity: 0.9;}​/* 今日进度 */.today-progress {  margin: 0 16px 16px;  background: var(--card-bg);  border-radius: 20px;  padding: 20px;  box-shadow: var(--shadow);}.progress-bar-wrap {  height: 16px;  background: #F0F0F0;  border-radius: 10px;  overflow: hidden;  margin-top: 12px;}.progress-bar {  height: 100%;  background: linear-gradient(90deg, var(--green), var(--blue));  border-radius: 10px;  transition: width 0.5s ease;}.progress-text {  display: flex;  justify-content: space-between;  font-size: 14px;  margin-top: 8px;  color: #888;}​/* 大按钮 */.big-btn {  display: flex;  align-items: center;  gap: 16px;  margin: 0 16px 14px;  padding: 20px;  border-radius: 20px;  border: none;  cursor: pointer;  font-size: 20px;  font-weight: 700;  color: white;  box-shadow: var(--shadow);  transition: transform 0.15s;  width: calc(100% - 32px);}.big-btn:active { transform: scale(0.96); }.big-btn .icon { font-size: 40px; }.big-btn .label { text-align: left; flex: 1; }.big-btn .label small { display: block; font-size: 13px; font-weight: 400; opacity: 0.85; margin-top: 2px; }​.btn-learn { background: linear-gradient(135deg, var(--blue), #6BB6FF); }.btn-review { background: linear-gradient(135deg, var(--green), #8FE388); }.btn-quiz { background: linear-gradient(135deg, var(--orange), var(--yellow)); }.btn-calendar { background: linear-gradient(135deg, var(--purple), #D4A5DD); }.btn-plan { background: linear-gradient(135deg, #FF6B6B, #FF8E8E); }.btn-library { background: linear-gradient(135deg, #4ECDC4, #6FE3DA); }​/* 打卡区域 */.checkin-section {  margin: 0 16px 16px;  background: var(--card-bg);  border-radius: 20px;  padding: 20px;  text-align: center;  box-shadow: var(--shadow);}.checkin-btn {  width: 80px;  height: 80px;  border-radius: 50%;  border: none;  background: linear-gradient(135deg, var(--green), #8FE388);  color: white;  font-size: 36px;  cursor: pointer;  box-shadow: var(--shadow-lg);  transition: transform 0.2s;  margin: 8px auto;  display: flex;  align-items: center;  justify-content: center;}.checkin-btn:active { transform: scale(0.9); }.checkin-btn.done {  background: linear-gradient(135deg, #CCC, #DDD);}.checkin-text { font-size: 16px; font-weight: 700; margin-top: 8px; }.checkin-sub { font-size: 13px; color: #888; margin-top: 4px; }​/* ========== 学习页 ========== */.word-card {  margin: 16px;  background: var(--card-bg);  border-radius: 28px;  padding: 32px 24px;  text-align: center;  box-shadow: var(--shadow-lg);  position: relative;}.word-emoji {  font-size: 96px;  line-height: 1.2;  margin-bottom: 8px;  cursor: pointer;  animation: bounce 2s ease-in-out infinite;}@keyframes bounce {  0%, 100% { transform: translateY(0); }  50% { transform: translateY(-8px); }}.word-emoji:active { animation: none; transform: scale(0.92); }​.word-en {  font-size: 40px;  font-weight: 800;  color: var(--text);  margin: 8px 0;  letter-spacing: 1px;}.word-cn {  font-size: 24px;  color: #888;  margin-bottom: 16px;}​.speak-btn {  width: 64px;  height: 64px;  border-radius: 50%;  border: none;  background: linear-gradient(135deg, var(--blue), #6BB6FF);  color: white;  font-size: 28px;  cursor: pointer;  box-shadow: var(--shadow);  transition: transform 0.15s;}.speak-btn:active { transform: scale(0.9); }.speak-btn.speaking {  animation: pulse 0.6s ease infinite;}@keyframes pulse {  0%, 100% { transform: scale(1); }  50% { transform: scale(1.15); }}​.word-nav {  display: flex;  justify-content: space-between;  align-items: center;  margin: 0 24px;  padding: 12px 0;}.nav-btn {  width: 56px;  height: 56px;  border-radius: 50%;  border: none;  background: var(--card-bg);  font-size: 24px;  cursor: pointer;  box-shadow: var(--shadow);  transition: transform 0.15s;  display: flex;  align-items: center;  justify-content: center;}.nav-btn:active { transform: scale(0.9); }.nav-btn:disabled { opacity: 0.3; }.word-counter {  font-size: 18px;  font-weight: 700;  color: var(--text);}​.learn-complete {  margin: 24px 16px;  text-align: center;}.complete-emoji {  font-size: 80px;  animation: celebrate 1s ease;}@keyframes celebrate {  0% { transform: scale(0) rotate(0); }  50% { transform: scale(1.3) rotate(180deg); }  100% { transform: scale(1) rotate(360deg); }}.complete-title {  font-size: 28px;  font-weight: 800;  color: var(--green);  margin: 16px 0 8px;}.complete-sub { font-size: 16px; color: #888; margin-bottom: 24px; }​/* ========== 分类选择 ========== */.category-grid {  display: grid;  grid-template-columns: repeat(2, 1fr);  gap: 12px;  padding: 16px;}.category-card {  background: var(--card-bg);  border-radius: 20px;  padding: 20px 16px;  text-align: center;  cursor: pointer;  box-shadow: var(--shadow);  transition: transform 0.15s;  border: 3px solid transparent;}.category-card:active { transform: scale(0.95); }.category-card.selected { border-color: var(--pink); }.category-emoji { font-size: 48px; }.category-name { font-size: 16px; font-weight: 700; margin-top: 8px; }.category-count { font-size: 12px; color: #aaa; margin-top: 4px; }​/* ========== 复习页 ========== */.review-card {  margin: 16px;  background: var(--card-bg);  border-radius: 28px;  padding: 32px 24px;  text-align: center;  box-shadow: var(--shadow-lg);}.review-emoji {  font-size: 80px;  margin-bottom: 8px;}.review-question {  font-size: 18px;  color: #888;  margin-bottom: 16px;}.review-options {  display: grid;  grid-template-columns: 1fr 1fr;  gap: 12px;  margin-top: 16px;}.review-option {  padding: 16px;  border-radius: 16px;  border: 3px solid #EEE;  background: var(--card-bg);  font-size: 18px;  font-weight: 700;  cursor: pointer;  transition: all 0.2s;}.review-option:active { transform: scale(0.95); }.review-option.correct {  background: var(--green);  color: white;  border-color: var(--green);}.review-option.wrong {  background: #FF6B6B;  color: white;  border-color: #FF6B6B;}​/* ========== 打卡日历 ========== */.calendar {  margin: 16px;  background: var(--card-bg);  border-radius: 20px;  padding: 20px;  box-shadow: var(--shadow);}.calendar-header {  display: flex;  justify-content: space-between;  align-items: center;  margin-bottom: 16px;}.calendar-header h3 { font-size: 18px; }.cal-nav-btn {  width: 36px;  height: 36px;  border-radius: 50%;  border: none;  background: #F5F5F5;  font-size: 16px;  cursor: pointer;}.calendar-grid {  display: grid;  grid-template-columns: repeat(7, 1fr);  gap: 4px;}.cal-weekday {  text-align: center;  font-size: 12px;  color: #AAA;  padding: 4px 0;}.cal-day {  aspect-ratio: 1;  display: flex;  align-items: center;  justify-content: center;  border-radius: 10px;  font-size: 15px;  position: relative;}.cal-day.checked {  background: var(--green);  color: white;  font-weight: 700;}.cal-day.checked::after {  content: '✓';  position: absolute;  bottom: 2px;  font-size: 10px;}.cal-day.today {  border: 2px solid var(--pink);  font-weight: 700;}.cal-day.empty { visibility: hidden; }​.streak-info {  display: flex;  gap: 12px;  margin: 0 16px 16px;}.streak-box {  flex: 1;  background: var(--card-bg);  border-radius: 16px;  padding: 16px;  text-align: center;  box-shadow: var(--shadow);}.streak-box .num { font-size: 32px; font-weight: 800; color: var(--orange); }.streak-box .label { font-size: 13px; color: #888; margin-top: 4px; }​/* ========== 计划页 ========== */.plan-section
